[package]
name = "rpn2"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
license = "MIT"
description = "Compiles math expressions (&str) into compact binary RPN bytecode. Zero-alloc, no_std, iterative, SIMD-assisted; built for live per-keystroke recompilation."
keywords = ["parser", "rpn", "bytecode", "expression", "no-std"]
readme = "README.md"
repository = "https://github.com/milkmadedev/rpn2"
categories = ["no-std", "parsing"]

[lib]
name = "rpn2"
path = "src/lib.rs"

# The library is no_std; only the CLI binary needs std. Gate it so embedded
# cross-builds skip it entirely.
[features]
std = []

[[bin]]
name = "rpn2"
path = "src/bin/rpn2.rs"
required-features = ["std"]

[dev-dependencies]
pratt-rpn = { path = "../pratt-rpn" }


[[example]]
name = "bench"
required-features = ["std"]
